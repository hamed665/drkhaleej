services:
  - type: worker
    name: drkhaleej-automation-worker-preview
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@10.22.0 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm automation:worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: preview
      - key: AUTOMATION_PREVIEW_ACTIVATION_ENABLED
        value: "false"
      - key: AUTOMATION_PREVIEW_ACTIVATION_SHA
        sync: false
      - key: AUTOMATION_EMERGENCY_ENABLED
        value: "false"
      - key: AUTOMATION_RUNTIME_PROBE_ENABLED
        value: "false"
      - key: AUTOMATION_PREVIEW_PROJECT_REF
        sync: false
      - key: AUTOMATION_PRODUCTION_PROJECT_REF
        sync: false
      - key: AUTOMATION_VERCEL_PREVIEW_HOST
        sync: false
      - key: AUTOMATION_INTERNAL_API_BASE_URL
        sync: false
      - key: AUTOMATION_SERVICE_KEY_ID
        sync: false
      - key: AUTOMATION_SERVICE_PRIVATE_KEY_PEM_BASE64
        sync: false
      - key: VERCEL_AUTOMATION_BYPASS_SECRET
        sync: false

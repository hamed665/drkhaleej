name: Cloudflare Candidate Secret Preflight

on:
  push:
    branches:
      - infra/cloudflare-web-readiness

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
      SUPABASE_PREVIEW_ANON_KEY: ${{ secrets.SUPABASE_PREVIEW_ANON_KEY }}
      NEXT_PUBLIC_PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_PREVIEW_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PREVIEW_SERVICE_ROLE_KEY }}
    steps:
      - name: Safe present/missing and identity checks
        shell: bash
        run: |
          set -euo pipefail

          present() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              printf '%s=PRESENT\n' "$name"
            else
              printf '%s=MISSING\n' "$name"
            fi
          }

          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CF_API_TOKEN \
            CF_ACCOUNT_ID \
            PREVIEW_PROJECT_REF \
            PRODUCTION_PROJECT_REF \
            PREVIEW_DATABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            PREVIEW_SUPABASE_ANON_KEY \
            SUPABASE_PREVIEW_ANON_KEY \
            NEXT_PUBLIC_PREVIEW_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            PREVIEW_SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_PREVIEW_SERVICE_ROLE_KEY
          do
            present "$name"
          done

          if [ -n "${PREVIEW_PROJECT_REF:-}" ] && [ -n "${PRODUCTION_PROJECT_REF:-}" ]; then
            if [ "$PREVIEW_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
              echo 'PROJECT_REFS_DISTINCT=NO'
            else
              echo 'PROJECT_REFS_DISTINCT=YES'
            fi
          else
            echo 'PROJECT_REFS_DISTINCT=UNKNOWN'
          fi

          if [ -n "${PREVIEW_PROJECT_REF:-}" ] && [ -n "${PREVIEW_DATABASE_URL:-}" ]; then
            python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          ref = os.environ['PREVIEW_PROJECT_REF']
          url = os.environ['PREVIEW_DATABASE_URL']
          host = (urlparse(url).hostname or '').lower()
          expected = f'db.{ref}.supabase.co'.lower()
          pooler_suffix = '.pooler.supabase.com'
          direct_match = host == expected
          pooler_match = host.endswith(pooler_suffix)
          print('PREVIEW_DATABASE_IDENTITY_MATCH=' + ('YES' if (direct_match or pooler_match) else 'NO'))
          PY
          else
            echo 'PREVIEW_DATABASE_IDENTITY_MATCH=UNKNOWN'
          fi

          if [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] || \
             [ -n "${PREVIEW_SUPABASE_ANON_KEY:-}" ] || \
             [ -n "${SUPABASE_PREVIEW_ANON_KEY:-}" ] || \
             [ -n "${NEXT_PUBLIC_PREVIEW_SUPABASE_ANON_KEY:-}" ]; then
            echo 'PREVIEW_ANON_KEY_AVAILABLE=YES'
          else
            echo 'PREVIEW_ANON_KEY_AVAILABLE=NO'
          fi

          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || \
             [ -n "${PREVIEW_SUPABASE_SERVICE_ROLE_KEY:-}" ] || \
             [ -n "${SUPABASE_PREVIEW_SERVICE_ROLE_KEY:-}" ]; then
            echo 'PREVIEW_SERVICE_ROLE_KEY_AVAILABLE=YES'
          else
            echo 'PREVIEW_SERVICE_ROLE_KEY_AVAILABLE=NO'
          fi

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || [ -n "${CF_API_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_TOKEN_AVAILABLE=YES'
          else
            echo 'CLOUDFLARE_TOKEN_AVAILABLE=NO'
          fi

          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -n "${CF_ACCOUNT_ID:-}" ]; then
            echo 'CLOUDFLARE_ACCOUNT_AVAILABLE=YES'
          else
            echo 'CLOUDFLARE_ACCOUNT_AVAILABLE=NO'
          fi

          echo 'No secret values or project refs were printed.'

env:
  PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  PREVIEW_MIGRATION_EVIDENCE_PATH: artifacts/preview-migration-sync/evidence.json
  PREVIEW_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  P05_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  P05_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  P05_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  P05_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  P05_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  P05_EVIDENCE_PATH: artifacts/p05/private-publish-proof.json
  P06_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  P06_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  P06_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  P06_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  P06_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  P06_EVIDENCE_PATH: artifacts/p06/rollback-authority-proof.json
  P07_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  P07_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  P07_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  P07_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  P07_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  P07_EVIDENCE_PATH: artifacts/p07/rollback-exact-recovery-proof.json
  P09_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  P09_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  P09_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  P09_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  P09_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  P09_EVIDENCE_PATH: artifacts/p09/real-admin-canary.json
  P09_RECOVERY_EVIDENCE_PATH: artifacts/p09/recovery-review-attempt.json
  P09_LITERAL_ENTITY_SHA256: 96c37e7cc021ea720993a05083da7a0fbf0ae0db0c1dfb37c34e02cc89a79187
  P09_LITERAL_DIAGNOSTIC_PATH: artifacts/p09/literal-ui-state-diagnostic.json
  P09_POSTGREST_VERSION_DIAGNOSTIC_PATH: artifacts/p09/postgrest-version-diagnostic.json
  P09_LITERAL_PUBLISH_DIAGNOSTIC_PATH: artifacts/p09/literal-publish-transaction-diagnostic.json
  P09_LITERAL_FINALIZE_ENABLED: 'true'
  P09_LITERAL_FINAL_EVIDENCE_PATH: artifacts/p09/literal-final-preview-cycle.json
  PHARMACY_NOINDEX_AUTHORITY_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  PHARMACY_NOINDEX_AUTHORITY_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  PHARMACY_NOINDEX_AUTHORITY_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  PHARMACY_NOINDEX_AUTHORITY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_NOINDEX_AUTHORITY_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_NOINDEX_AUTHORITY_EVIDENCE_PATH: artifacts/pharmacy-public-noindex-authority/proof.json
  PHARMACY_BILINGUAL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_BILINGUAL_EVIDENCE_PATH: artifacts/pharmacy-bilingual-live-verify/proof.json
  PHARMACY_PUBLIC_ROLLBACK_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  PHARMACY_PUBLIC_ROLLBACK_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  PHARMACY_PUBLIC_ROLLBACK_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  PHARMACY_PUBLIC_ROLLBACK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_PUBLIC_ROLLBACK_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_PUBLIC_ROLLBACK_EVIDENCE_PATH: artifacts/pharmacy-public-rollback/proof.json
  PHARMACY_INDEX_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  PHARMACY_INDEX_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  PHARMACY_INDEX_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  PHARMACY_INDEX_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_INDEX_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_INDEX_EVIDENCE_PATH: artifacts/pharmacy-index-promotion/proof.json
  PHARMACY_SITEMAP_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  PHARMACY_SITEMAP_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  PHARMACY_SITEMAP_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  PHARMACY_SITEMAP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_SITEMAP_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
  PHARMACY_SITEMAP_EVIDENCE_PATH: artifacts/pharmacy-sitemap-promotion/proof.json
  SOURCE_EVIDENCE_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  SOURCE_EVIDENCE_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  SOURCE_EVIDENCE_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  SOURCE_EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_EVIDENCE_LEDGER_EVIDENCE_PATH: artifacts/source-evidence-ledger/proof.json
  ENTITY_CANDIDATE_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  ENTITY_CANDIDATE_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  ENTITY_CANDIDATE_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  ENTITY_CANDIDATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  ENTITY_CANDIDATE_EVIDENCE_PATH: artifacts/entity-candidate-pipeline/proof.json

permissions:
  contents: read

concurrency:
  group: drmuscat-isolated-preview-database-write
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$P05_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$P06_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$P07_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$P09_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$PHARMACY_NOINDEX_AUTHORITY_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$PHARMACY_BILINGUAL_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$PHARMACY_PUBLIC_ROLLBACK_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$PHARMACY_INDEX_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$SOURCE_EVIDENCE_SOURCE_COMMIT"
          test "$PREVIEW_SOURCE_COMMIT" = "$PHARMACY_SITEMAP_SOURCE_COMMIT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked contract validator dependencies
        run: npm --prefix docs/ai-agent-program/drkhaleej-ai-agent-program-2026-v1.2.2 ci --ignore-scripts --cache "${RUNNER_TEMP}/drkhaleej-contract-npm-cache"

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate repository migration, RLS and aligned state contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/preview-migration-sync artifacts/p05 artifacts/p06 artifacts/p07 artifacts/p09 artifacts/pharmacy-public-noindex-authority artifacts/pharmacy-bilingual-live-verify artifacts/pharmacy-public-rollback artifacts/pharmacy-index-promotion artifacts/pharmacy-sitemap-promotion artifacts/source-evidence-ledger artifacts/entity-candidate-pipeline
          {
            pnpm db:validate:migrations
            pnpm test:db:rls
            node scripts/import/check-import-readiness-state-alignment.mjs
            node scripts/import/check-import-p05-private-publish-proof.mjs
            node scripts/import/check-import-p06-rollback-authority-proof.mjs
            node scripts/import/check-import-p07-rollback-exact-recovery-proof.mjs
            node scripts/import/check-import-pharmacy-minimal-admin-ui.mjs
            node scripts/import/check-import-p09-real-admin-canary.mjs
            node scripts/import/check-pharmacy-public-noindex-authority.mjs
            pnpm import:pharmacy-bilingual-live:validate
            pnpm import:pharmacy-public-rollback:validate
            pnpm import:pharmacy-index-promotion:validate
            pnpm import:pharmacy-sitemap-promotion:validate
            pnpm import:source-evidence-ledger:validate
            pnpm import:duplicate-geo-contract:validate
            pnpm import:contract-hardening:validate
            pnpm import:entity-candidate-pipeline:validate
          } 2>&1 | tee artifacts/preview-migration-sync/validation.log

      - name: Fail-closed identity preflight
        run: node scripts/db/preview-migration-sync.mjs preflight

      - name: Apply ledger-missing migrations under advisory lock
        run: node scripts/db/run-preview-migration-sync.mjs

      - name: Verify exact ledger and database inventories
        run: node scripts/db/preview-migration-sync.mjs verify

      - name: Diagnose persisted literal Admin canary state
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p09-literal-ui-state-diagnostic.mjs 2>&1 | tee artifacts/p09/literal-ui-state-diagnostic.log

      - name: Verify PostgREST timestamp representation
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p09-postgrest-version-diagnostic.mjs 2>&1 | tee artifacts/p09/postgrest-version-diagnostic.log

      - name: Diagnose literal publish RPC inside rollback transaction
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p09-literal-publish-transaction-diagnostic.mjs 2>&1 | tee artifacts/p09/literal-publish-transaction-diagnostic.log

      - name: Prove fresh expired-Reservation recovery Review attempt
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p09-recovery-review-attempt-proof.mjs 2>&1 | tee artifacts/p09/recovery-review-attempt.log

      - name: Run isolated P05 private publish proof
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p05-private-publish-proof.mjs 2>&1 | tee artifacts/p05/hosted-proof.log

      - name: Run isolated P06 atomic rollback authority proof
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p06-rollback-authority-proof.mjs 2>&1 | tee artifacts/p06/hosted-proof.log

      - name: Run isolated P07 exact rollback recovery proof
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p07-rollback-exact-recovery-proof.mjs 2>&1 | tee artifacts/p07/hosted-proof.log

      - name: Run isolated P09 integrated Admin canary proof
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p09-real-admin-canary.mjs 2>&1 | tee artifacts/p09/hosted-proof.log

      - name: Complete exact literal Preview cycle from persisted truth
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-p09-literal-finalize-preview-cycle.mjs 2>&1 | tee artifacts/p09/literal-final-preview-cycle.log

      - name: Prove Pharmacy public/noindex authority only
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-pharmacy-public-noindex-authority-proof.mjs 2>&1 | tee artifacts/pharmacy-public-noindex-authority/hosted-proof.log

      - name: Write Pharmacy bilingual live route evidence
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/write-pharmacy-bilingual-live-evidence.mjs 2>&1 | tee artifacts/pharmacy-bilingual-live-verify/hosted-proof.log

      - name: Prove exact Pharmacy public rollback
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-pharmacy-public-rollback-proof.mjs 2>&1 | tee artifacts/pharmacy-public-rollback/hosted-proof.log

      - name: Prove independent Pharmacy Index promotion and rollback
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-pharmacy-index-promotion-proof.mjs 2>&1 | tee artifacts/pharmacy-index-promotion/hosted-proof.log

      - name: Prove independent Pharmacy Sitemap inclusion and rollback
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-pharmacy-sitemap-promotion-proof.mjs 2>&1 | tee artifacts/pharmacy-sitemap-promotion/hosted-proof.log

      - name: Prove private Source Evidence ledger lifecycle
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-source-evidence-ledger-proof.mjs 2>&1 | tee artifacts/source-evidence-ledger/hosted-proof.log

      - name: Prove atomic Entity Candidate persistence and readback
        shell: bash
        run: |
          set -o pipefail
          node scripts/import/run-entity-candidate-pipeline-proof.mjs 2>&1 | tee artifacts/entity-candidate-pipeline/hosted-proof.log

      - name: Upload Preview migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-migration-sync-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/preview-migration-sync/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-SHA P05 private publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-private-publish-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/p05/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-SHA P06 rollback authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p06-rollback-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/p06/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-SHA P07 rollback exact recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p07-rollback-exact-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/p07/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-SHA P09 Admin canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p09-real-admin-canary-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/p09/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Pharmacy public/noindex authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-public-noindex-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pharmacy-public-noindex-authority/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Pharmacy bilingual live route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-bilingual-live-verify-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pharmacy-bilingual-live-verify/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Pharmacy public rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-public-rollback-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pharmacy-public-rollback/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Pharmacy Index promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-index-promotion-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pharmacy-index-promotion/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Pharmacy Sitemap promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-sitemap-promotion-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pharmacy-sitemap-promotion/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Source Evidence ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-ledger-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/source-evidence-ledger/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Entity Candidate pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-candidate-pipeline-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/entity-candidate-pipeline/
          if-no-files-found: error
          retention-days: 30

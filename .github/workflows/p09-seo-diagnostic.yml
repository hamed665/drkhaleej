name: P09 SEO Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p09-seo-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies quietly
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Capture exact SEO failure
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/seo
          pnpm seo:check > artifacts/seo/seo.log 2>&1
          code=$?
          tail -n 120 artifacts/seo/seo.log
          exit "$code"
      - name: Upload SEO diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p09-seo-diagnostic-${{ github.event.pull_request.head.sha }}
          path: artifacts/seo/seo.log
          if-no-files-found: error
          retention-days: 1

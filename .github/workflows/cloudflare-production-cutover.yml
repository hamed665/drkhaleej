name: Cloudflare Production Stage and Cutover

on:
  push:
    branches:
      - infra/cloudflare-web-cutover
  workflow_dispatch:
    inputs:
      mode:
        description: "Run isolated Production-backed stage, or stage then Production cutover"
        required: true
        default: stage
        type: choice
        options:
          - stage
          - cutover

permissions:
  contents: read

concurrency:
  group: cloudflare-production-cutover
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'stage' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Refuse automatic Production cutover
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RUN_MODE}" = "stage"

      - name: Refuse Production cutover outside main
        if: ${{ env.RUN_MODE == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF_NAME}" = "main"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm 10.22.0
        run: corepack prepare pnpm@10.22.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate cutover runner syntax
        run: |
          node --check scripts/cloudflare/production-runtime-smoke.mjs
          node --check scripts/cloudflare/production-cutover.mjs

      - name: Read-only Production preflight
        run: node scripts/cloudflare/production-preflight.mjs

      - name: Run isolated stage or guarded Production cutover
        run: node scripts/cloudflare/production-cutover.mjs --mode "${RUN_MODE}"

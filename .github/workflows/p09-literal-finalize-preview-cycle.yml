name: P09 Literal Preview Completion

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import/run-p09-literal-finalize-preview-cycle.mjs'
      - 'src/server/admin/import-pharmacy-private-admin-runtime-context.ts'
      - 'src/server/admin/import-pharmacy-private-admin-runtime-context-legacy-source.test.ts'
      - '.github/workflows/p09-literal-finalize-preview-cycle.yml'

permissions:
  contents: read

concurrency:
  group: drmuscat-isolated-preview-database-write
  cancel-in-progress: false

env:
  P09_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
  P09_PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
  P09_PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
  P09_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  P09_LITERAL_ENTITY_SHA256: 96c37e7cc021ea720993a05083da7a0fbf0ae0db0c1dfb37c34e02cc89a79187
  P09_LITERAL_FINALIZE_ENABLED: 'true'
  P09_LITERAL_FINAL_EVIDENCE_PATH: artifacts/p09/literal-final-preview-cycle.json

jobs:
  finalize:
    # This one-time mutation proof may run automatically only on the dedicated P09 branch.
    # After merge, future PRs cannot mutate the fixed Preview canary merely by touching shared files.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'agent/real-admin-canary-p09')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$P09_SOURCE_COMMIT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run legacy-source regression test
        run: pnpm vitest run src/server/admin/import-pharmacy-private-admin-runtime-context-legacy-source.test.ts

      - name: Finalize exact literal Preview cycle
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/p09
          node scripts/import/run-p09-literal-finalize-preview-cycle.mjs 2>&1 | tee artifacts/p09/literal-final-preview-cycle.log

      - name: Upload literal completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p09-literal-final-preview-cycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/p09/
          if-no-files-found: error
          retention-days: 30

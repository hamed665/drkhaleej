name: Cloudflare Temporary Runtime Probe

on:
  push:
    branches:
      - infra/cloudflare-web-readiness

permissions:
  contents: read

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[skip-cloudflare-temp-probe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: https://www.drkhaleej.com
      NEXT_PUBLIC_SITE_NAME: DrKhaleej
      NEXT_PUBLIC_DEFAULT_LOCALE: en
      NEXT_PUBLIC_SUPPORTED_LOCALES: en,ar
      NEXT_PUBLIC_DEFAULT_COUNTRY: om
      NEXT_PUBLIC_ALLOWED_PUBLIC_LOCALES: en,ar
      NEXT_PUBLIC_ALLOWED_PUBLIC_COUNTRIES: om
      NEXT_PUBLIC_ENABLE_INDEXING: 'false'
      DRMUSCAT_PUBLIC_FAQ_CMS_ENABLED: 'false'
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-web-readiness
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vinext Worker
        run: pnpm build:vinext

      - name: Deploy to isolated temporary Cloudflare account
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cloudflare-temporary-deploy.log"
          if ! pnpm exec wrangler deploy \
            --temporary \
            --config dist/server/wrangler.json \
            --name drkhaleej-web-runtime-probe \
            >"$log" 2>&1; then
            echo 'Temporary deployment failed. Sanitized tail follows.'
            tail -n 80 "$log" \
              | sed -E 's#https?://[^[:space:]]+#<url-redacted>#g; s#[A-Za-z0-9_-]{32,}#<token-redacted>#g'
            exit 1
          fi

          base_url="$(python3 - "$log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          urls = re.findall(r'https://[A-Za-z0-9.-]+\.workers\.dev(?:/[^\s]*)?', text)
          if not urls:
              raise SystemExit(1)
          print(urls[-1].rstrip('/'))
          PY
          )"

          if [ -z "$base_url" ]; then
            echo 'Temporary Worker URL could not be extracted without exposing the claim URL.'
            exit 1
          fi

          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "Temporary Worker host: ${base_url#https://}"
          echo 'Claim URL intentionally suppressed.'

      - name: Safe runtime smoke
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          set -euo pipefail

          probe_get() {
            local label="$1"
            local path="$2"
            local headers="$RUNNER_TEMP/${label}.headers"
            local body="$RUNNER_TEMP/${label}.body"
            local code
            code="$(curl --max-time 20 -sS -D "$headers" -o "$body" -w '%{http_code}' "$BASE_URL$path")"
            local location
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$headers")"
            printf '%s HTTP=%s' "$label" "$code"
            if [ -n "$location" ]; then
              printf ' LOCATION=%s' "$location"
            fi
            printf '\n'
          }

          probe_post_json() {
            local label="$1"
            local path="$2"
            local body="$RUNNER_TEMP/${label}.body"
            local code
            code="$(curl --max-time 20 -sS -o "$body" -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              --data '{}' \
              "$BASE_URL$path")"
            printf '%s HTTP=%s\n' "$label" "$code"
          }

          probe_get root '/'
          probe_get auth_callback_no_code '/auth/callback?next=%2Fadmin'
          probe_get robots '/robots.txt'
          probe_get public_en '/en/om'
          probe_get public_ar '/ar/om'
          probe_post_json automation_fail_closed '/api/internal/automation'
          probe_post_json callback_invalid '/api/callback-requests'
          probe_post_json provider_onboarding_invalid '/api/provider-onboarding-leads'

          echo 'No Production domain, DNS route, Supabase credential, Cloudflare account credential or claim URL was used or printed.'

name: P09 UI Publish RPC Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import/diagnose-p09-ui-publish-rpc-probe.mjs'
      - '.github/workflows/p09-ui-publish-rpc-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      PREVIEW_PROJECT_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      P09_UI_ENTITY_ID: 4410ded2-57c5-4120-9e48-ffecc62b8685
      P09_UI_DIAGNOSTIC_PATH: artifacts/p09-ui-publish/rpc-probe.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Probe isolated Preview RPC under transaction rollback
        run: node scripts/import/diagnose-p09-ui-publish-rpc-probe.mjs
      - name: Upload redacted probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p09-ui-publish-rpc-probe-${{ github.event.pull_request.head.sha }}
          path: artifacts/p09-ui-publish/rpc-probe.json
          if-no-files-found: error
          retention-days: 1

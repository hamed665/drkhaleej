name: Cloudflare Live Baseline Snapshot

on:
  push:
    branches:
      - infra/cloudflare-web-readiness

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, '[live-baseline]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-web-readiness
          fetch-depth: 0

      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils

      - name: Capture public DNS, HTTP and TLS baseline
        shell: bash
        run: |
          set -euo pipefail
          out="docs/project-state/CLOUDFLARE_WEB_MIGRATION_BASELINE.md"
          mkdir -p "$(dirname "$out")"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          capture_dns() {
            local host="$1" type="$2"
            echo '```text'
            dig +noall +answer "$host" "$type" || true
            echo '```'
          }

          capture_authoritative() {
            local ns="$1" host="$2" type="$3"
            echo "### ${host} ${type} via ${ns}"
            echo '```text'
            dig +noall +answer "@${ns}" "$host" "$type" || true
            echo '```'
          }

          capture_redirect() {
            local url="$1"
            echo "### ${url}"
            echo '```text'
            curl -sS -o /dev/null -D - -L --max-redirs 10 --connect-timeout 10 --max-time 30 "$url" \
              | tr -d '\r' \
              | grep -Ei '^(HTTP/|location:|server:|cf-ray:|cf-cache-status:|cache-control:|age:|via:|x-vercel-|x-powered-by:|strict-transport-security:)' || true
            echo '```'
          }

          capture_final_headers() {
            local url="$1"
            echo "### ${url}"
            echo '```text'
            curl -sS -o /dev/null -D - --connect-timeout 10 --max-time 30 "$url" \
              | tr -d '\r' \
              | grep -Ei '^(HTTP/|server:|cf-ray:|cf-cache-status:|cache-control:|age:|etag:|last-modified:|content-type:|content-length:|vary:|x-vercel-|x-powered-by:|strict-transport-security:|x-content-type-options:|x-frame-options:|referrer-policy:|permissions-policy:|cross-origin-opener-policy:)' || true
            echo '```'
          }

          capture_tls() {
            local host="$1"
            echo "### ${host}"
            echo '```text'
            timeout 20 bash -c "echo | openssl s_client -servername '$host' -connect '$host:443' 2>/dev/null | openssl x509 -noout -subject -issuer -serial -dates -ext subjectAltName" || true
            echo '```'
          }

          fetch_seo() {
            local label="$1" url="$2" file="$tmp/$label"
            local status
            status="$(curl -sS -L -o "$file" -w '%{http_code}' --max-redirs 10 --connect-timeout 10 --max-time 30 "$url")"
            echo "### ${url}"
            echo "- HTTP: ${status}"
            echo "- SHA256: $(sha256sum "$file" | awk '{print $1}')"
            echo '- Canonical / robots / hreflang evidence:'
            echo '```text'
            grep -Eio '<link[^>]+rel=["'"']canonical["'"'][^>]*>|<meta[^>]+name=["'"']robots["'"'][^>]*>|<link[^>]+hreflang=[^>]*>' "$file" | head -n 30 || true
            echo '```'
          }

          {
            echo '# Cloudflare Web Migration Live Baseline'
            echo
            echo '> Public pre-cutover evidence only. No DNS or Production mutation is performed by this snapshot.'
            echo
            echo "- Captured UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Source branch head: $(git rev-parse HEAD)"
            echo '- Canonical production URL under preservation: `https://www.drkhaleej.com/en/om`'
            echo
            echo '## Recursive DNS snapshot'
            for type in NS SOA A AAAA CAA; do
              echo "### drkhaleej.com ${type}"
              capture_dns drkhaleej.com "$type"
            done
            for type in CNAME A AAAA; do
              echo "### www.drkhaleej.com ${type}"
              capture_dns www.drkhaleej.com "$type"
            done

            echo '## Authoritative DNS snapshot'
            mapfile -t nameservers < <(dig +short NS drkhaleej.com | sed 's/\.$//' | sort -u)
            if [ "${#nameservers[@]}" -eq 0 ]; then
              echo '- BLOCKER: no authoritative nameservers were returned.'
            else
              for ns in "${nameservers[@]}"; do
                for spec in 'drkhaleej.com A' 'drkhaleej.com AAAA' 'drkhaleej.com CAA' 'www.drkhaleej.com CNAME' 'www.drkhaleej.com A' 'www.drkhaleej.com AAAA'; do
                  read -r host type <<<"$spec"
                  capture_authoritative "$ns" "$host" "$type"
                done
              done
            fi

            echo '## Redirect and proxy/CDN evidence'
            capture_redirect 'http://drkhaleej.com/'
            capture_redirect 'https://drkhaleej.com/'
            capture_redirect 'http://www.drkhaleej.com/'
            capture_redirect 'https://www.drkhaleej.com/'

            echo '## Production header/cache baseline'
            capture_final_headers 'https://www.drkhaleej.com/en/om'
            capture_final_headers 'https://www.drkhaleej.com/ar/om'
            capture_final_headers 'https://www.drkhaleej.com/robots.txt'
            capture_final_headers 'https://www.drkhaleej.com/sitemap.xml'
            capture_final_headers 'https://www.drkhaleej.com/admin/login'

            echo '## TLS certificate baseline'
            capture_tls drkhaleej.com
            capture_tls www.drkhaleej.com

            echo '## SEO content fingerprints'
            fetch_seo en-home 'https://www.drkhaleej.com/en/om'
            fetch_seo ar-home 'https://www.drkhaleej.com/ar/om'
            fetch_seo robots 'https://www.drkhaleej.com/robots.txt'
            fetch_seo sitemap 'https://www.drkhaleej.com/sitemap.xml'

            echo '## Interpretation rules'
            echo '- Authoritative answers above are the rollback DNS evidence. Do not mutate DNS until the candidate runtime and environment parity gates are green.'
            echo '- If public records terminate at a CDN/proxy, the hidden origin is intentionally recorded as not externally observable rather than guessed.'
            echo '- `x-vercel-*` evidence, if present, is recorded only as an observed header and is not treated as proof of account ownership.'
          } > "$out"

          git diff --check -- "$out"

      - name: Commit public baseline evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-state/CLOUDFLARE_WEB_MIGRATION_BASELINE.md
          if git diff --cached --quiet; then
            echo "No baseline change to commit"
            exit 0
          fi
          git commit -m "docs(cloudflare): capture live pre-cutover baseline [live-baseline]"
          git push origin HEAD:infra/cloudflare-web-readiness

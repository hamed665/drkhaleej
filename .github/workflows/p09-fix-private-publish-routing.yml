name: P09 Fix Private Publish Routing

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p09-fix-private-publish-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Route private publish before transient runtime-context gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/admin/imports/readiness/actions.ts')
          text = path.read_text()

          assert 'let operationFailureBlockers' not in text
          text = text.replace(
              '  let reservationReplayed = false;\n  let rollbackReplayed = false;\n',
              '  let reservationReplayed = false;\n  let rollbackReplayed = false;\n  let operationFailureBlockers: string[] = [];\n',
              1,
          )

          pattern = re.compile(
              r'\n      if \(operation === "private_publish"\) \{.*?\n      \}\n\n      if \(operation === "reserve_private_publish"\)',
              re.S,
          )
          match = pattern.search(text)
          assert match, 'existing private publish block not found'
          text = text[:match.start()] + '\n\n      if (operation === "reserve_private_publish")' + text[match.end():]

          publish_block = '''      if (operation === "private_publish") {
                const dependencies = createPharmacyPrivateAdminPublishOperationDependenciesFromEnvironment({
                  allowedActorIds,
                  allowedEntityIds,
                });
                const published = dependencies
                  ? await runPharmacyPrivateAdminPublishOperation({
                      environment: process.env.VERCEL_ENV,
                      actorId,
                      entityId: actionEntityId,
                      allowedActorIds,
                      allowedEntityIds,
                      confirmation: confirmation ?? "",
                      now: new Date().toISOString(),
                      dependencies,
                    })
                  : null;
                operationFailureBlockers = published?.blocker
                  ? [published.blocker]
                  : dependencies
                    ? []
                    : ["publish_dependencies_unavailable"];
                return {
                  operation,
                  status: published?.published ? "completed" : "failed",
                  entityId: actionEntityId,
                  blockers: [],
                  publicVisibility: "private",
                  indexEligible: false,
                  sitemapEligible: false,
                  routeEnabled: false,
                  executionReference: published?.executionReference ?? null,
                };
              }

'''
          anchor = '      const reader = createPharmacyPrivateAdminRuntimeContextReaderFromEnvironment();\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, publish_block + anchor, 1)

          marker = '  const actionResult = await action({ actorId: admin.id, formData });\n  const workflow = "workflow" in actionResult ? actionResult.workflow : null;\n  const actionBlockers = actionResult.ok ? [] : actionResult.blockers;\n'
          replacement = marker + '  const workflowBlockers = workflow?.blockers ?? [];\n'
          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)

          old_blockers = '    blockers: succeeded ? [] : [...actionBlockers, ...(readbackVerified ? [] : ["state_readback_unverified"])],\n'
          new_blockers = '''    blockers: succeeded
              ? []
              : [...new Set([
                  ...actionBlockers,
                  ...workflowBlockers,
                  ...operationFailureBlockers,
                  ...(readbackVerified ? [] : ["state_readback_unverified"]),
                ])],
'''
          assert text.count(old_blockers) == 1
          text = text.replace(old_blockers, new_blockers, 1)

          assert text.index('if (operation === "private_publish")') < text.index('const reader = createPharmacyPrivateAdminRuntimeContextReaderFromEnvironment()')
          assert text.count('if (operation === "private_publish")') == 1
          path.write_text(text)

          Path('src/app/admin/imports/readiness/actions-routing.test.ts').write_text('''import { readFileSync } from "node:fs";
import { describe, expect, it } from "vitest";

describe("P09 UI private publish routing", () => {
  it("uses persisted Reservation authority before transient runtime-context gates", () => {
    const source = readFileSync(new URL("./actions.ts", import.meta.url), "utf8");
    const publishBranch = source.indexOf('if (operation === "private_publish")');
    const runtimeReader = source.indexOf("const reader = createPharmacyPrivateAdminRuntimeContextReaderFromEnvironment()");

    expect(publishBranch).toBeGreaterThan(-1);
    expect(runtimeReader).toBeGreaterThan(-1);
    expect(publishBranch).toBeLessThan(runtimeReader);
    expect(source.match(/if \(operation === "private_publish"\)/g)).toHaveLength(1);
    expect(source).toContain("operationFailureBlockers = published?.blocker");
    expect(source).toContain("...workflowBlockers");
  });
});
''')

          Path('.github/workflows/p09-fix-private-publish-routing.yml').unlink()
          PY

      - name: Commit routing fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/admin/imports/readiness/actions.ts src/app/admin/imports/readiness/actions-routing.test.ts .github/workflows/p09-fix-private-publish-routing.yml
          git commit -m "fix(p09): use Reservation as UI publish authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
